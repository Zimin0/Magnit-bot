<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Магнит · Редактор корзин</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand"><span class="brand-mark">М</span><span>Магнит <small> / Редактор корзин</small></span></div>
    <button id="save" class="primary" disabled>Сохранить</button>
  </header>
  <main>
    <div class="hero">
      <div><h1 id="title">Корзины</h1><p id="intro">Тяните карточки за ⠿, чтобы менять порядок и переносить их между списками.</p></div>
      <button id="create-category" class="outline">＋ Категория</button>
    </div>
    <nav class="tabs" aria-label="Разделы">
      <button data-tab="baskets" aria-current="page">Корзины</button>
      <button data-tab="products">Любимые продукты</button>
      <button data-tab="settings">Настройки</button>
    </nav>
    <p id="status" role="status" aria-live="polite">Загружаю конфиг…</p>
    <div id="workspace"></div>
  </main>
  <dialog id="editor">
    <form id="form">
      <div class="dialog-head"><h2 id="editor-title"></h2><button id="close" type="button" aria-label="Закрыть">×</button></div>
      <div id="fields"></div>
      <div class="dialog-actions"><button id="remove" type="button" class="danger">Удалить</button><button class="primary" type="submit">Готово</button></div>
    </form>
  </dialog>
</body>
</html>
